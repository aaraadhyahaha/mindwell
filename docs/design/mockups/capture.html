<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mindwell mockup: Capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.mw{--bg:#F5F0E6;--side:#ECE5D6;--surface:#FBF8F2;--ink:#1F1B16;--muted:#655D52;--rule:#D9D0C1;--accent:#3E5C58;--soft:#E3EAE6;--on-accent:#FBF8F2;--placeholder:#8C8376;--leader:#B9AE9C;font-family:'Schibsted Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-columns:252px 1fr;min-height:900px;font-size:15px;line-height:1.5}
.mw *{box-sizing:border-box}
.serif{font-family:'Tinos','Times New Roman',serif}
.side{background:var(--side);border-right:1px solid var(--rule);display:flex;flex-direction:column;padding:22px 12px 14px}
.brand{padding:2px 12px 18px;border-bottom:1px solid var(--rule);margin:0 0 6px}
.brand b{font-family:'Tinos','Times New Roman',serif;font-style:italic;font-weight:400;font-size:24px;display:block;letter-spacing:-0.01em;line-height:1.2}
.brand span{font-size:12px;color:var(--muted);font-family:'Tinos','Times New Roman',serif;font-style:italic}
.sec{font-size:12px;color:var(--muted);padding:16px 12px 6px;font-weight:600;margin:0}
.nav{display:flex;align-items:center;gap:11px;height:36px;padding:0 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14.5px;font-weight:500}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;color:var(--muted);flex:none}
.nav.on{background:var(--soft);color:var(--accent);font-weight:600}
.nav.on svg{color:var(--accent)}
.nav .count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.toc{list-style:none;margin:2px 0 0;padding:0}
.toc a{display:flex;gap:10px;align-items:baseline;padding:4px 12px;font-size:13.5px;color:var(--muted);text-decoration:none;border-radius:6px}
.toc a i{font-family:'Tinos','Times New Roman',serif;font-style:normal;width:18px;text-align:right;font-size:13px;flex:none}
.toc a.read{color:var(--ink)}
.toc a.read::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:auto;align-self:center}
.side .spacer{flex:1}
.main{display:flex;flex-direction:column;min-width:0}
.bar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid var(--rule);gap:16px}
.runhead{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.runhead em{font-family:'Tinos','Times New Roman',serif;font-style:italic;text-transform:none;letter-spacing:0;font-size:14px;font-weight:400;margin-left:10px}
.btn{font:600 14px/1 'Schibsted Grotesk',sans-serif;height:38px;padding:0 16px;border-radius:9px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);height:44px;padding:0 22px}
.btn.quiet{background:none;border-color:transparent;color:var(--accent);padding:0 8px}
.kbd{font:500 11.5px/1 'Schibsted Grotesk',sans-serif;color:var(--muted);border:1px solid var(--rule);border-radius:5px;padding:4px 6px;background:var(--bg)}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
h1.title{font-family:'Tinos','Times New Roman',serif;font-weight:400;font-size:42px;line-height:1.12;margin:10px 0 0;letter-spacing:-0.015em}
.lede{font-family:'Tinos','Times New Roman',serif;font-style:italic;color:var(--muted);font-size:18px;line-height:1.5;margin:12px 0 0;max-width:560px}
.opener-rule{width:48px;border:0;border-top:1px solid var(--ink);margin:28px 0 40px}
.ornament{display:flex;align-items:center;gap:14px;color:var(--rule);margin:8px 0 36px}
.ornament::before,.ornament::after{content:"";flex:1;border-top:1px solid var(--rule)}
.ornament svg{width:14px;height:14px;fill:var(--muted)}
.margin{border-left:1px solid var(--rule);padding-left:32px}
.mnote{margin:0 0 30px}
.mnote p{font-family:'Tinos','Times New Roman',serif;font-size:15px;line-height:1.5;margin:6px 0 0}
.mnote .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.tag{display:inline-block;font:600 11.5px/1 'Schibsted Grotesk',sans-serif;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--accent);vertical-align:2px}

.mw.night{--bg:#1A1815;--side:#14120F;--surface:#221F1B;--ink:#E8E0D2;--muted:#A0968A;--rule:#3A352E;--accent:#8FB3AC;--soft:#2C3A37;--on-accent:#1A1815;--placeholder:#857B6E;--leader:#5A5248}

.cw{--bg:#F5F0E6;--surface:#FBF8F2;--ink:#1F1B16;--muted:#655D52;--rule:#D9D0C1;--accent:#3E5C58;--soft:#E3EAE6;width:560px;height:240px;box-sizing:border-box;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:22px 26px 18px;font-family:'Schibsted Grotesk',sans-serif;color:var(--ink);display:flex;flex-direction:column}
.cw .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.cw .q{display:flex;align-items:baseline;gap:8px;font-family:'Tinos','Times New Roman',serif;font-size:22px;margin-top:12px;border-bottom:1px solid var(--ink);padding-bottom:8px}
.cw .q span{color:var(--muted);font-style:italic;white-space:nowrap}
.cw .q input{flex:1;border:0;background:none;font:400 22px 'Tinos','Times New Roman',serif;color:var(--ink);outline:none;min-width:0;padding:0}
.cw .row{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:12px}
.cw .int{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.cw .int button{width:30px;height:30px;border-radius:50%;border:1px solid var(--rule);background:var(--bg);font:400 13px 'Tinos','Times New Roman',serif;color:var(--ink);cursor:pointer}
.cw .int button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cw .sug{font-size:13px;color:var(--muted)}
.cw .sug b{font-family:'Tinos','Times New Roman',serif;font-style:italic;font-weight:400;color:var(--ink)}
.cw .sug button{font:600 13px 'Schibsted Grotesk',sans-serif;color:var(--accent);background:none;border:0;cursor:pointer;padding:0 0 0 6px}
.cw .keys{margin-top:auto;display:flex;gap:16px;font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}
.cw .kbd{font:500 11.5px/1 'Schibsted Grotesk',sans-serif;border:1px solid var(--rule);border-radius:5px;padding:3px 6px;background:var(--bg);margin-right:5px;color:var(--muted)}

</style>
<style>body{background:#F5F0E6}</style>
</head>
<body>
<div style="padding:40px"><div class="cw" role="dialog" aria-label="Capture a thought">
<p class="label">Notice and name</p>
<label class="q"><span>There's the</span><input type="text" value="I'll blank on the first question" aria-label="The thought"><span>thought.</span></label>
<div class="row">
<div class="int" role="radiogroup" aria-label="Intensity"><span style="margin-right:4px">Intensity</span><button type="button" role="radio" aria-checked="false">1</button><button type="button" role="radio" aria-checked="false">2</button><button type="button" role="radio" aria-checked="false">3</button><button class="on" type="button" role="radio" aria-checked="true">4</button><button type="button" role="radio" aria-checked="false">5</button></div>
<div class="sug">Story: <b>I'll fail</b>?<button type="button">Yes</button><button type="button">Other</button></div>
</div>
<div class="keys"><span><span class="kbd">Enter</span>Save</span><span><span class="kbd">Tab</span>Intensity and story</span><span><span class="kbd">Esc</span>Close</span></div>
</div></div>
</body>
</html>
